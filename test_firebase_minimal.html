<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase OTP Test - Minimal</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; }
        .container { background: #f9f9f9; padding: 20px; border-radius: 8px; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #4285f4; color: white; border: none; cursor: pointer; }
        button:disabled { background: #ccc; }
        .error { background: #ffebee; color: #c62828; padding: 10px; border-radius: 4px; margin: 10px 0; }
        .success { background: #e8f5e8; color: #2e7d32; padding: 10px; border-radius: 4px; margin: 10px 0; }
        .hidden { display: none; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 4px; overflow-x: auto; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔥 Firebase Phone OTP Test</h2>
        
        <div class="error" id="errorMsg" style="display: none;"></div>
        <div class="success" id="successMsg" style="display: none;"></div>

        <!-- Step 1: Send OTP -->
        <div id="step1">
            <h3>Step 1: Send OTP</h3>
            <input type="tel" id="phoneNumber" placeholder="+918825727948" value="+918825727948">
            <button id="sendBtn" onclick="sendOTP()">Send OTP</button>
            <p><small>Make sure Phone Authentication is enabled in Firebase Console</small></p>
        </div>

        <!-- Step 2: Verify OTP -->
        <div id="step2" class="hidden">
            <h3>Step 2: Enter OTP</h3>
            <input type="text" id="otpCode" placeholder="Enter 6-digit code" maxlength="6">
            <button id="verifyBtn" onclick="verifyOTP()">Verify OTP</button>
        </div>

        <!-- Step 3: Session -->
        <div id="step3" class="hidden">
            <h3>Step 3: Success!</h3>
            <button onclick="getProfile()">Get Profile</button>
            <button onclick="logout()">Logout</button>
            <div id="userInfo" class="hidden"></div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyDyuK7MkjyKO4CppchllGk_SFw6ilnYZSo",
            authDomain: "docblitz-437213.firebaseapp.com",
            projectId: "docblitz-437213",
            storageBucket: "docblitz-437213.firebasestorage.app",
            messagingSenderId: "1066464674690",
            appId: "1:1066464674690:web:2f52360633df725bd8059b",
            measurementId: "G-VHD6Z5B7NK"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        window.auth = firebase.auth();

        const API_URL = 'http://localhost:5600';

        async function sendOTP() {
            const phoneNumber = document.getElementById('phoneNumber').value;
            const sendBtn = document.getElementById('sendBtn');

            if (!phoneNumber || !phoneNumber.startsWith('+')) {
                showError('Please enter phone number in E.164 format (e.g., +918825727948)');
                return;
            }

            sendBtn.disabled = true;
            sendBtn.textContent = 'Sending...';
            hideMessages();

            try {
                // Try with different reCAPTCHA configurations
                let recaptchaVerifier;
                
                try {
                    // Option 1: Invisible reCAPTCHA
                    recaptchaVerifier = new firebase.auth.RecaptchaVerifier('sendBtn', {
                        'size': 'invisible',
                        'callback': () => console.log('reCAPTCHA solved (invisible)'),
                        'expired-callback': () => console.log('reCAPTCHA expired')
                    });
                } catch (e1) {
                    console.log('Invisible reCAPTCHA failed, trying normal...');
                    
                    try {
                        // Option 2: Normal reCAPTCHA
                        recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
                            'size': 'normal',
                            'callback': () => console.log('reCAPTCHA solved (normal)'),
                            'expired-callback': () => console.log('reCAPTCHA expired')
                        });
                        
                        // Add container if it doesn't exist
                        if (!document.getElementById('recaptcha-container')) {
                            const container = document.createElement('div');
                            container.id = 'recaptcha-container';
                            document.getElementById('step1').appendChild(container);
                        }
                        
                    } catch (e2) {
                        console.log('Normal reCAPTCHA failed, trying with render...');
                        
                        // Option 3: Manual render
                        recaptchaVerifier = new firebase.auth.RecaptchaVerifier('sendBtn', {
                            'size': 'invisible'
                        });
                        
                        await recaptchaVerifier.render();
                    }
                }

                console.log('reCAPTCHA created successfully, sending OTP...');
                
                const confirmationResult = await auth.signInWithPhoneNumber(phoneNumber, recaptchaVerifier);
                window.confirmationResult = confirmationResult;

                showSuccess('✅ OTP sent successfully! Check your phone.');
                showInfo('📱 Enter the 6-digit code you received');

                // Move to step 2
                document.getElementById('step1').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');

            } catch (error) {
                console.error('Full error details:', error);
                
                let errorMessage = error.message;
                
                // Provide specific error messages
                if (error.code === 'auth/internal-error') {
                    errorMessage = `reCAPTCHA configuration issue. Try these steps:
1. Go to Firebase Console → Authentication → Settings
2. Check "Authorized domains" includes 'localhost'
3. Try Chrome Incognito mode
4. Clear browser cache`;
                } else if (error.code === 'auth/unauthorized-domain') {
                    errorMessage = 'Domain not authorized. Add localhost to Firebase authorized domains.';
                } else if (error.code === 'auth/too-many-requests') {
                    errorMessage = 'Too many requests. Please wait a few minutes.';
                } else if (error.code === 'auth/invalid-phone-number') {
                    errorMessage = 'Invalid phone number format. Use E.164 format (e.g., +918825727948)';
                }

                showError(`❌ Failed to send OTP: ${errorMessage}`);
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send OTP';
            }
        }

        async function verifyOTP() {
            const code = document.getElementById('otpCode').value;
            const verifyBtn = document.getElementById('verifyBtn');

            if (!code || code.length !== 6) {
                showError('Please enter the 6-digit OTP code');
                return;
            }

            verifyBtn.disabled = true;
            verifyBtn.textContent = 'Verifying...';
            hideMessages();

            try {
                const result = await window.confirmationResult.confirm(code);
                const idToken = await result.user.getIdToken();

                showInfo('✅ OTP verified! Creating session...');

                // Create session on backend
                const response = await fetch(`${API_URL}/v1/firebase-otp/session`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idToken }),
                    credentials: 'include'
                });

                const data = await response.json();

                if (data.success) {
                    showSuccess(`🎉 Logged in successfully! UID: ${data.data.uid}`);
                    
                    document.getElementById('step2').classList.add('hidden');
                    document.getElementById('step3').classList.remove('hidden');
                    
                    localStorage.setItem('authToken', data.data.token);
                } else {
                    showError(`Failed to create session: ${data.message}`);
                    verifyBtn.disabled = false;
                    verifyBtn.textContent = 'Verify OTP';
                }

            } catch (error) {
                console.error('Error verifying OTP:', error);
                showError(`Failed to verify OTP: ${error.message}`);
                verifyBtn.disabled = false;
                verifyBtn.textContent = 'Verify OTP';
            }
        }

        async function getProfile() {
            hideMessages();
            
            try {
                const response = await fetch(`${API_URL}/v1/firebase-otp/me`, {
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('userInfo').innerHTML = 
                        '<h4>Your Profile:</h4><pre>' + 
                        JSON.stringify(data.data.user, null, 2) + 
                        '</pre>';
                    document.getElementById('userInfo').classList.remove('hidden');
                    showSuccess('✅ Profile loaded!');
                } else {
                    showError(`Failed to get profile: ${data.message}`);
                }
                
            } catch (error) {
                console.error('Error getting profile:', error);
                showError(`Failed to get profile: ${error.message}`);
            }
        }

        async function logout() {
            hideMessages();
            
            try {
                await fetch(`${API_URL}/v1/firebase-otp/logout`, {
                    method: 'POST',
                    credentials: 'include'
                });
                
                localStorage.removeItem('authToken');
                showSuccess('✅ Logged out successfully!');
                
                setTimeout(() => {
                    location.reload();
                }, 1500);
                
            } catch (error) {
                console.error('Error logging out:', error);
                showError(`Failed to logout: ${error.message}`);
            }
        }

        // Helper functions
        function showSuccess(msg) {
            const el = document.getElementById('successMsg');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function showInfo(msg) {
            const el = document.getElementById('infoMsg');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function hideMessages() {
            document.getElementById('successMsg').style.display = 'none';
            document.getElementById('errorMsg').style.display = 'none';
            if (document.getElementById('infoMsg')) {
                document.getElementById('infoMsg').style.display = 'none';
            }
        }
    </script>
</body>
</html>
