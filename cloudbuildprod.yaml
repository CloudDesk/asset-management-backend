        AMAZON_MARKETPLACE_ID=${_AMAZON_MARKETPLACE_ID},
        AMAZON_REGION=${_AMAZON_REGION},
        AMAZON_CLIENT_ID=${_AMAZON_CLIENT_ID},
        AMAZON_CLIENT_SECRET=${_AMAZON_CLIENT_SECRET},
        AMAZON_REFRESH_TOKEN=${_AMAZON_REFRESH_TOKEN},
        AMAZON_ENVIRONMENT=${_AMAZON_ENVIRONMENT},
        AMAZON_SELLER_CENTRAL_URL=${_AMAZON_SELLER_CENTRAL_URL},
        AMAZON_SELLER_ID=${_AMAZON_SELLER_ID},
        JWT_SECRET=${_JWT_SECRET},
        JWT_ACCESS_TOKEN_EXPIRY=${_JWT_ACCESS_TOKEN_EXPIRY},
