steps:
  # Step 1: Set GCP project
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "config"
      - "set"
      - "project"
      - "nivaana"

  # Step 3: Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/nivaana/nivaana-prodenv:latest"
      - "."

  # Step 4: Push the Docker image to Google Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/nivaana/nivaana-prodenv:latest"

  # Step 5: Deploy the image to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "nivaana"
      - "--image"
      - "gcr.io/nivaana/nivaana-prodenv:latest"
      - "--region"
      - "asia-south1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--service-account"
      - "nivaana-prod@nivaana.iam.gserviceaccount.com"
      - "--set-env-vars"
      - |
        GCP_PROJECT_ID=${_GCP_PROJECT_ID},
        GCP_PROJECT_LOCATION=${_GCP_PROJECT_LOCATION},
        GCP_PROJECT_QUEUE=${_GCP_PROJECT_QUEUE},
        GCP_TASK_URL=${_GCP_TASK_URL},
        FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID},
        FIREBASE_CLIENT_EMAIL=${_FIREBASE_CLIENT_EMAIL},
        FIREBASE_PRIVATE_KEY=${_FIREBASE_PRIVATE_KEY},
        APNS_AUTH_KEY=${_APNS_AUTH_KEY},
        APNS_KEY_ID=${_APNS_KEY_ID},
        APNS_TEAM_ID=${_APNS_TEAM_ID},
        APNS_BUNDLE_ID=${_APNS_BUNDLE_ID},
        GMAIL_AUTH_PASSWORD=${_GMAIL_AUTH_PASSWORD},
        GMAIL_AUTH_USER=${_GMAIL_AUTH_USER},
        GMAIL_HOST=${_GMAIL_HOST},
        GMAIL_PORT=${_GMAIL_PORT},
        GMAIL_SERVICE=${_GMAIL_SERVICE},
        POSTGRES_DATABASE=${_POSTGRES__DATABASE},
        POSTGRES_HOST=${_POSTGRES_HOST},
        POSTGRES_PASSWORD=${_POSTGRES_PASSWORD},
        POSTGRES_PORT=${_POSTGRES_PORT},
        POSTGRES_USER=${_POSTGRES_USER},
        POSTGRESS_QUERY_API=${_POSTGRESS_QUERY_API},
        REDIRECT_INVENTORY_URL=${_REDIRECT_INVENTORY_URL},
        REDIRECT_URL_FAILURE=${_REDIRECT_URL_FAILURE},
        REDIRECT_URL_PAYMENT_STATUS=${_REDIRECT_URL_PAYMENT_STATUS},
        REDIRECT_URL_SUCCESS=${_REDIRECT_URL_SUCCESS},
        REDIS_EMAIL_OTPEXPSEC=${_REDIS_EMAIL_OTPEXPSEC},
        REDIS_HOST=${_REDIS_HOST},
        REDIS_PASSWORD=${_REDIS_PASSWORD},
        REDIS_USERNAME=${_REDIS_USERNAME},
        REDIS_PORT=${_REDIS_PORT},
        REDIS_SESSIONEXSEC=${_REDIS_SESSIONEXSEC},
        DATABASE_URL=${_DATABASE_URL},
        NODE_ENV=${_NODE_ENV},
        API_BASE_URL=${_API_BASE_URL},
        PHONEPE_AUTH_MODE=${_PHONEPE_AUTH_MODE},
        PHONEPE_CLIENT_ID=${_PHONEPE_CLIENT_ID},
        PHONEPE_CLIENT_SECRET=${_PHONEPE_CLIENT_SECRET},
        PHONEPE_CLIENT_VERSION=${_PHONEPE_CLIENT_VERSION},
        PHONEPE_ENVIRONMENT=${_PHONEPE_ENVIRONMENT},
        PHONEPE_OAUTH_URL=${_PHONEPE_OAUTH_URL},
        EXOTEL_ACCOUNT_SID=${_EXOTEL_ACCOUNT_SID},
        EXOTEL_API_KEY=${_EXOTEL_API_KEY},
