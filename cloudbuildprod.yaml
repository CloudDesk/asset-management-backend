steps:
  # Step 1: Set GCP project
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "config"
      - "set"
      - "project"
      - "nivaana"

  # Step 3: Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/nivaana/nivaana-prodenv:latest"
      - "."

  # Step 4: Push the Docker image to Google Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/nivaana/nivaana-prodenv:latest"

  # Step 5: Deploy the image to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "nivaana"
      - "--image"
      - "gcr.io/nivaana/nivaana-prodenv:latest"
      - "--region"
      - "asia-south1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--service-account"
      - "nivaana-prod@nivaana.iam.gserviceaccount.com"
      - "--set-env-vars"
      - "GCP_PROJECT_ID=${_GCP_PROJECT_ID},GCP_PROJECT_LOCATION=${_GCP_PROJECT_LOCATION},GCP_PROJECT_QUEUE=${_GCP_PROJECT_QUEUE},GCP_TASK_URL=${_GCP_TASK_URL},GMAIL_AUTH_PASSWORD=${_GMAIL_AUTH_PASSWORD},GMAIL_AUTH_USER=${_GMAIL_AUTH_USER},GMAIL_HOST=${_GMAIL_HOST},GMAIL_PORT=${_GMAIL_PORT},GMAIL_SERVICE=${_GMAIL_SERVICE},POSTGRES_DATABASE=${_POSTGRES__DATABASE},POSTGRES_HOST=${_POSTGRES_HOST},POSTGRES_PASSWORD=${_POSTGRES_PASSWORD},POSTGRES_PORT=${_POSTGRES_PORT},POSTGRES_USER=${_POSTGRES_USER},POSTGRESS_QUERY_API=${_POSTGRESS_QUERY_API},REDIRECT_INVENTORY_URL=${_REDIRECT_INVENTORY_URL},REDIRECT_URL_FAILURE=${_REDIRECT_URL_FAILURE},REDIRECT_URL_PAYMENT_STATUS=${_REDIRECT_URL_PAYMENT_STATUS},REDIRECT_URL_SUCCESS=${_REDIRECT_URL_SUCCESS},REDIS_EMAIL_OTPEXPSEC=${_REDIS_EMAIL_OTPEXPSEC},REDIS_HOST=${_REDIS_HOST},REDIS_PASSWORD=${_REDIS_PASSWORD},REDIS_USERNAME=${_REDIS_USERNAME},REDIS_PORT=${_REDIS_PORT},REDIS_SESSIONEXSEC=${_REDIS_SESSIONEXSEC},DATABASE_URL=${_DATABASE_URL},NODE_ENV=${_NODE_ENV},API_BASE_URL=${_API_BASE_URL},PHONEPE_AUTH_MODE=${_PHONEPE_AUTH_MODE},PHONEPE_CLIENT_ID=${_PHONEPE_CLIENT_ID},PHONEPE_CLIENT_SECRET=${_PHONEPE_CLIENT_SECRET},PHONEPE_CLIENT_VERSION=${_PHONEPE_CLIENT_VERSION},PHONEPE_OAUTH_URL=${_PHONEPE_OAUTH_URL},TWILIO_ACCOUNT_SID=${_TWILIO_ACCOUNT_SID},TWILIO_AUTH_TOKEN=${_TWILIO_AUTH_TOKEN},TWILIO_PHONE_NUMBER=${_TWILIO_PHONE_NUMBER},FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID},FIREBASE_CLIENT_EMAIL=${_FIREBASE_CLIENT_EMAIL},FIREBASE_PRIVATE_KEY=${_FIREBASE_PRIVATE_KEY},APP_JWT_SECRET=${_APP_JWT_SECRET},OTP_EXPIRY_SECONDS=${_OTP_EXPIRY_SECONDS},OTP_MAX_ATTEMPTS=${_OTP_MAX_ATTEMPTS},RATE_LIMIT_SEND_MAX=${_RATE_LIMIT_SEND_MAX},RATE_LIMIT_SEND_WINDOW=${_RATE_LIMIT_SEND_WINDOW},RATE_LIMIT_VERIFY_MAX=${_RATE_LIMIT_VERIFY_MAX},RATE_LIMIT_VERIFY_WINDOW=${_RATE_LIMIT_VERIFY_WINDOW},BLOCK_DURATION=${_BLOCK_DURATION}"

# Substitution variables matched exactly to  env
substitutions:
  _GCP_PROJECT_ID: "${GCP_PROJECT_ID}"
  _GCP_PROJECT_LOCATION: "${GCP_PROJECT_LOCATION}"
  _GCP_PROJECT_QUEUE: "${GCP_PROJECT_QUEUE}"
  _GCP_TASK_URL: "${GCP_TASK_URL}"
  _GMAIL_AUTH_PASSWORD: "${GMAIL_AUTH_PASSWORD}"
  _GMAIL_AUTH_USER: "${GMAIL_AUTH_USER}"
  _GMAIL_HOST: "${GMAIL_HOST}"
  _GMAIL_PORT: "${GMAIL_PORT}"
  _GMAIL_SERVICE: "${GMAIL_SERVICE}"
  _POSTGRES__DATABASE: "${POSTGRES__DATABASE}"
  _POSTGRES_HOST: "${POSTGRES_HOST}"
  _POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  _POSTGRES_PORT: "${POSTGRES_PORT}"
  _POSTGRES_USER: "${POSTGRES_USER}"
  _POSTGRESS_QUERY_API: "${POSTGRESS_QUERY_API}"
  _REDIRECT_INVENTORY_URL: "${REDIRECT_INVENTORY_URL}"
  _REDIRECT_URL_FAILURE: "${REDIRECT_URL_FAILURE}"
  _REDIRECT_URL_PAYMENT_STATUS: "${REDIRECT_URL_PAYMENT_STATUS}"
  _REDIRECT_URL_SUCCESS: "${REDIRECT_URL_SUCCESS}"
  _REDIS_EMAIL_OTPEXPSEC: "${REDIS_EMAIL_OTPEXPSEC}"
  _REDIS_HOST: "${REDIS_HOST}"
  _REDIS_PASSWORD: "${REDIS_PASSWORD}"
  _REDIS_USERNAME: "${REDIS_USERNAME}"
  _REDIS_PORT: "${REDIS_PORT}"
  _REDIS_SESSIONEXSEC: "${REDIS_SESSIONEXSEC}"
  _DATABASE_URL: "${DATABASE_URL}"
  _NODE_ENV: "${NODE_ENV}"
  _API_BASE_URL: "${API_BASE_URL}"
  _PHONEPE_AUTH_MODE: "${PHONEPE_AUTH_MODE}"
  _PHONEPE_CLIENT_ID: "${PHONEPE_CLIENT_ID}"
  _PHONEPE_CLIENT_SECRET: "${PHONEPE_CLIENT_SECRET}"
  _PHONEPE_CLIENT_VERSION: "${PHONEPE_CLIENT_VERSION}"
  _PHONEPE_OAUTH_URL: "${PHONEPE_OAUTH_URL}"
  _TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID}"
  _TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN}"
  _TWILIO_PHONE_NUMBER: "${TWILIO_PHONE_NUMBER}"
  _FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID}"
  _FIREBASE_CLIENT_EMAIL: "${FIREBASE_CLIENT_EMAIL}"
  _FIREBASE_PRIVATE_KEY: "${FIREBASE_PRIVATE_KEY}"
  _APP_JWT_SECRET: "${APP_JWT_SECRET}"
  _OTP_EXPIRY_SECONDS: "${OTP_EXPIRY_SECONDS}"
  _OTP_MAX_ATTEMPTS: "${OTP_MAX_ATTEMPTS}"
  _RATE_LIMIT_SEND_MAX: "${RATE_LIMIT_SEND_MAX}"
  _RATE_LIMIT_SEND_WINDOW: "${RATE_LIMIT_SEND_WINDOW}"
  _RATE_LIMIT_VERIFY_MAX: "${RATE_LIMIT_VERIFY_MAX}"
  _RATE_LIMIT_VERIFY_WINDOW: "${RATE_LIMIT_VERIFY_WINDOW}"
  _BLOCK_DURATION: "${BLOCK_DURATION}"

options:
  logging: CLOUD_LOGGING_ONLY
