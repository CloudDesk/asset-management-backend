steps:
  # Step 1: Set GCP project
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "config"
      - "set"
      - "project"
      - "nivaana"

  # Step 2: Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/nivaana/nivaana-sit:latest"
      - "."

  # Step 3: Push the Docker image to Google Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/nivaana/nivaana-sit:latest"

  # Step 4a: Remove the old Cloud Run Secret Manager bindings for Amazon credentials.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        gcloud run services update nivaana-dev \
          --region asia-south1 \
          --remove-secrets AMAZON_CLIENT_ID,AMAZON_CLIENT_SECRET,AMAZON_REFRESH_TOKEN || true

  # Step 4b: Deploy to Cloud Run SIT using .env.sit plus temporary Amazon substitutions.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "nivaana-dev"
      - "--image"
      - "gcr.io/nivaana/nivaana-sit:latest"
      - "--region"
      - "asia-south1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--service-account"
      - "nivaana-dev@nivaana.iam.gserviceaccount.com"
      - "--port"
      - "5600"
      - "--env-vars-file"
      - ".env.sit"
      - "--set-env-vars"
      - "AMAZON_CLIENT_ID=${_AMAZON_CLIENT_ID},AMAZON_CLIENT_SECRET=${_AMAZON_CLIENT_SECRET},AMAZON_REFRESH_TOKEN=${_AMAZON_REFRESH_TOKEN}"

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _AMAZON_CLIENT_ID: "SET_AT_BUILD_SUBMISSION"
  _AMAZON_CLIENT_SECRET: "SET_AT_BUILD_SUBMISSION"
  _AMAZON_REFRESH_TOKEN: "SET_AT_BUILD_SUBMISSION"
