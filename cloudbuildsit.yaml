steps:
  # Step 1: Set GCP project
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "config"
      - "set"
      - "project"
      - "nivaana"

  # Step 2: Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/nivaana/nivaana-sit:latest"
      - "."

  # Step 3: Push the Docker image to Google Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/nivaana/nivaana-sit:latest"

  # Step 4: Deploy to Cloud Run SIT using .env.sit.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "nivaana-dev"
      - "--image"
      - "gcr.io/nivaana/nivaana-sit:latest"
      - "--region"
      - "asia-south1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--service-account"
      - "nivaana-dev@nivaana.iam.gserviceaccount.com"
      - "--port"
      - "5600"
      - "--memory"
      - "512Mi"
      # Above the 10-minute attempt deadline of the Amazon Cloud Scheduler jobs (order / listing sync wait for the import).
      - "--timeout"
      - "900"
      - "--env-vars-file"
      - ".env.sit"
      # Amazon credentials now come from .env.sit like every other SIT setting (2026-10-23).
      # Removes the old Secret Manager references so the plain values can replace them.
      - "--clear-secrets"

options:
  logging: CLOUD_LOGGING_ONLY
