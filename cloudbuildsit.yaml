steps:
  # Step 1: Set GCP project
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "config"
      - "set"
      - "project"
      - "nivaana"

  # Step 2: Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/nivaana/nivaana-sit:latest"
      - "."

  # Step 3: Push the Docker image to Google Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/nivaana/nivaana-sit:latest"

  # Step 4: Materialize the SIT environment from Secret Manager only inside the
  # ephemeral Cloud Build workspace. Never commit this generated file.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    secretEnv:
      - "SIT_ENV_FILE"
    args:
      - "-c"
      - |
        set -euo pipefail
        umask 077
        printf '%s' "$$SIT_ENV_FILE" > .env.sit
        test -s .env.sit

  # Step 5: Deploy to Cloud Run SIT using the generated environment file plus
  # the existing per-variable Amazon secrets.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "nivaana-dev"
      - "--image"
      - "gcr.io/nivaana/nivaana-sit:latest"
      - "--region"
      - "asia-south1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--service-account"
      - "nivaana-dev@nivaana.iam.gserviceaccount.com"
      - "--port"
      - "5600"
      - "--memory"
      - "512Mi"
      - "--env-vars-file"
      - ".env.sit"
      - "--set-secrets"
      - "AMAZON_CLIENT_ID=nivaana-sit-amazon-client-id:latest,AMAZON_CLIENT_SECRET=nivaana-sit-amazon-client-secret:latest,AMAZON_REFRESH_TOKEN=nivaana-sit-amazon-refresh-token:latest"

availableSecrets:
  secretManager:
    - versionName: "projects/$PROJECT_ID/secrets/nivaana-sit-env/versions/latest"
      env: "SIT_ENV_FILE"

options:
  logging: CLOUD_LOGGING_ONLY
