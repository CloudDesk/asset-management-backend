steps:
  # Build and publish the backend image for the isolated UAT service.
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/nivaana/nivaana-uat:latest"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/nivaana/nivaana-uat:latest"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "nivaana-uat"
      - "--project"
      - "nivaana"
      - "--image"
      - "gcr.io/nivaana/nivaana-uat:latest"
      - "--region"
      - "asia-south1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--service-account"
      - "nivaana-uat@nivaana.iam.gserviceaccount.com"
      - "--port"
      - "5600"
      - "--memory"
      - "512Mi"
      # Above the 10-minute attempt deadline of the Amazon Cloud Scheduler jobs (order / listing sync wait for the import).
      - "--timeout"
      - "900"
      - "--env-vars-file"
      - ".env.uat"
      # Amazon credentials stay in Secret Manager (config/amazon-secrets.uat.json): GitHub push protection blocks them in .env.uat.
      - "--set-secrets"
      - "AMAZON_CLIENT_ID=nivaana-uat-amazon-client-id:latest,AMAZON_CLIENT_SECRET=nivaana-uat-amazon-client-secret:latest,AMAZON_REFRESH_TOKEN=nivaana-uat-amazon-refresh-token:latest"

options:
  logging: CLOUD_LOGGING_ONLY
